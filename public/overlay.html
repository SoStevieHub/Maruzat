<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Mental0 · Overlay</title>
<style>
  /* Oswald projeye gömülü — OBS'de CDN beklemesin diye. */
  @font-face {
    font-family: 'Oswald';
    font-style: normal;
    font-weight: 200 700;
    font-display: block;
    src: url('/fonts/oswald-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Oswald';
    font-style: normal;
    font-weight: 200 700;
    font-display: block;
    src: url('/fonts/oswald-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  /* Overlay'in tamamı şeffaf: hiçbir yerde zemin rengi yok. */
  html, body {
    margin: 0;
    padding: 0;
    width: 960px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  :root {
    --golge: 0 2px 4px rgba(0,0,0,.95), 0 4px 18px rgba(0,0,0,.75), 0 0 40px rgba(0,0,0,.45);
    --iyi: #53fc18;
    --orta: #ffc531;
    --kotu: #ff4d4d;
  }

  #sahne {
    position: absolute;
    left: 0; bottom: 0;
    width: 960px;
    padding: 0 56px 72px 56px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 34px;
  }

  /* Panelden açılabilen zemin. Yalnızca içeriğin kapladığı alanı örter (#sahne
     alta yaslı ve boyu içerik kadar), yukarı doğru şeffaflaşır. Sağ kenarda da
     maske ile söner ki ekranın ortasında keskin bir çizgi oluşmasın.
     Yazıyı etkilemesin diye ::before kullanılıyor, içerik z-index ile üstte. */
  #sahne.zeminli { padding-top: 200px; }
  #sahne.zeminli::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(
      to top,
      rgba(0,0,0,.90) 0%,
      rgba(0,0,0,.80) 32%,
      rgba(0,0,0,.52) 62%,
      rgba(0,0,0,.20) 84%,
      rgba(0,0,0,0) 100%);
    -webkit-mask-image: linear-gradient(to right, #000 60%, transparent 100%);
            mask-image: linear-gradient(to right, #000 60%, transparent 100%);
  }
  #mesaj, #rapor { position: relative; z-index: 1; }

  /* ─── Öne çıkarılan mesaj ─────────────────────────────────────────────── */
  #mesaj {
    display: flex;
    align-items: flex-start;
    gap: 26px;
    opacity: 0;
    transform: translateX(-40px);
    transition: opacity .45s ease, transform .55s cubic-bezier(.2,.9,.25,1);
  }
  #mesaj.acik { opacity: 1; transform: none; }

  .avatar {
    flex: 0 0 auto;
    width: 108px; height: 108px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 3px var(--renk, #53fc18), 0 6px 26px rgba(0,0,0,.8);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar .harf {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: var(--renk, #53fc18);
    color: #0a0a0a;
    font-weight: 400;
    font-size: 52px;
    line-height: 1;
    padding-top: 4px;
    box-sizing: border-box;
  }

  .govde { min-width: 0; padding-top: 4px; }

  .kullanici {
    font-weight: 400;
    font-size: 27px;
    letter-spacing: .10em;
    text-transform: uppercase;
    color: var(--renk, #53fc18);
    text-shadow: var(--golge);
    margin-bottom: 6px;
  }

  .metin {
    font-weight: 300;
    font-size: 44px;
    line-height: 1.18;
    color: #fff;
    text-shadow: var(--golge);
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  /* ─── AI mental sağlık raporu ─────────────────────────────────────────── */
  #rapor {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity .5s ease, transform .6s cubic-bezier(.2,.9,.25,1);
    max-height: 0;
  }
  #rapor.acik { opacity: 1; transform: none; max-height: 900px; }

  .cizgi {
    height: 2px;
    width: 100%;
    background: linear-gradient(90deg, rgba(255,255,255,.85), rgba(255,255,255,0));
    margin-bottom: 22px;
  }

  .rapor-ust {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
  }
  .etiket {
    font-weight: 400;
    font-size: 19px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: rgba(255,255,255,.9);
    text-shadow: var(--golge);
  }

  /* Ses çalarken oynayan eşitleyici çubukları */
  #eq { display: none; align-items: flex-end; gap: 4px; height: 20px; }
  #eq.acik { display: flex; }
  #eq span {
    width: 4px; height: 6px;
    background: var(--skorRenk, #53fc18);
    box-shadow: 0 2px 6px rgba(0,0,0,.9);
    animation: zipla .7s infinite ease-in-out;
  }
  #eq span:nth-child(2) { animation-delay: .12s; }
  #eq span:nth-child(3) { animation-delay: .24s; }
  #eq span:nth-child(4) { animation-delay: .36s; }
  @keyframes zipla { 0%,100% { height: 5px; } 50% { height: 20px; } }

  .teshis {
    font-weight: 400;
    font-size: 54px;
    line-height: 1.05;
    letter-spacing: .01em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: var(--golge);
    margin-bottom: 18px;
  }

  .skor-satir {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .skor-kutu {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,.22);
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,.6);
  }
  .skor-dolu {
    height: 100%;
    width: 0%;
    background: var(--skorRenk, #53fc18);
    border-radius: 3px;
    transition: width 1.1s cubic-bezier(.2,.9,.25,1);
  }
  .skor-deger {
    font-weight: 400;
    font-size: 30px;
    color: var(--skorRenk, #53fc18);
    text-shadow: var(--golge);
    min-width: 84px;
    text-align: right;
  }

  .rapor-metin {
    font-weight: 300;
    font-size: 34px;
    line-height: 1.3;
    color: #fff;
    text-shadow: var(--golge);
    min-height: 1.3em;
  }
  .imlec {
    display: inline-block;
    width: 3px;
    height: .95em;
    background: #fff;
    vertical-align: -2px;
    margin-left: 3px;
    animation: yanip .8s steps(1) infinite;
  }
  @keyframes yanip { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }

  .uyari {
    margin-top: 16px;
    font-weight: 300;
    font-size: 17px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(255,255,255,.6);
    text-shadow: var(--golge);
  }
</style>
</head>
<body>

<div id="sahne">
  <div id="mesaj">
    <div class="avatar" id="avatar"></div>
    <div class="govde">
      <div class="kullanici" id="kullanici"></div>
      <div class="metin" id="metin"></div>
    </div>
  </div>

  <div id="rapor">
    <div class="cizgi"></div>
    <div class="rapor-ust">
      <div class="etiket">Mental Sağlık Raporu</div>
      <div id="eq"><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="teshis" id="teshis"></div>
    <div class="skor-satir">
      <div class="skor-kutu"><div class="skor-dolu" id="skorDolu"></div></div>
      <div class="skor-deger" id="skorDeger"></div>
    </div>
    <div class="rapor-metin" id="raporMetin"></div>
    <div class="uyari">Gerçek bir teşhis değildir. AI lan bu!</div>
  </div>
</div>

<audio id="ses"></audio>
<script src="/socket.io/socket.io.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const socket = io();

  let sonHighlightId = null;
  let sonNonce = 0;
  let yazmaTimer = null;

  // Aynı anda birden fazla overlay açıkken (OBS kaynağı + tarayıcı önizlemesi)
  // hepsi çalınca ses duble duyuluyor. Sesi yalnızca sunucunun seçtiği overlay çalar.
  // ?ad=... ile panelde ayırt edici bir isim verilebilir.
  const overlayAdi = new URLSearchParams(location.search).get('ad') || '';
  let sesBendeMi = false;

  let listeGeldi = false;

  socket.on('connect', () => socket.emit('overlay:merhaba', { ad: overlayAdi }));
  socket.on('overlay:liste', ({ sesSahibi }) => {
    listeGeldi = true;
    sesBendeMi = sesSahibi === socket.id;
  });

  // Emniyet: liste hiç gelmezse (eski sunucu, kopuk bağlantı) overlay kalıcı sessiz
  // kalmasın — sessiz bir yayın, çift sesten daha kötü.
  setTimeout(() => { if (!listeGeldi) sesBendeMi = true; }, 3000);

  // Uzun metinlerde punto küçülsün ki sol yarıya sığsın.
  // basla = küçültmenin devreye girdiği karakter sayısı, bit = en küçük puntoya inilen uzunluk.
  function puntoAyarla(el, uzunluk, buyuk, kucuk, basla, bit) {
    const oran = Math.min(1, Math.max(0, (uzunluk - basla) / (bit - basla)));
    el.style.fontSize = (buyuk - (buyuk - kucuk) * oran).toFixed(1) + 'px';
  }

  function avatarCiz(h) {
    const kutu = $('avatar');
    kutu.style.setProperty('--renk', h.color || '#53fc18');
    if (h.avatar) {
      kutu.innerHTML = '<img alt="">';
      const img = kutu.querySelector('img');
      // Fotoğraf yüklenemezse sessizce baş harfe düş.
      img.onerror = () => { kutu.innerHTML = '<div class="harf">' + harf(h.user) + '</div>'; };
      img.src = h.avatar;
    } else {
      kutu.innerHTML = '<div class="harf">' + harf(h.user) + '</div>';
    }
  }

  function harf(isim) {
    return (isim || '?').trim().charAt(0).toLocaleUpperCase('tr-TR');
  }

  function skorRengi(skor) {
    if (skor < 35) return 'var(--kotu)';
    if (skor < 70) return 'var(--orta)';
    return 'var(--iyi)';
  }

  function daktilo(el, text, sure) {
    clearInterval(yazmaTimer);
    yazmaTimer = null;
    el.textContent = '';
    const imlec = document.createElement('span');
    imlec.className = 'imlec';
    el.appendChild(imlec);

    const adim = Math.max(12, Math.min(45, sure / Math.max(1, text.length)));
    let i = 0;
    yazmaTimer = setInterval(() => {
      i++;
      el.textContent = text.slice(0, i);
      if (i < text.length) el.appendChild(imlec);
      else { clearInterval(yazmaTimer); yazmaTimer = null; }
    }, adim);
  }

  function mesajCiz(h) {
    if (!h) {
      $('mesaj').classList.remove('acik');
      sonHighlightId = null;
      return;
    }
    const yeni = h.id !== sonHighlightId;
    sonHighlightId = h.id;

    avatarCiz(h);
    $('kullanici').textContent = h.user;
    $('kullanici').style.setProperty('--renk', h.color || '#53fc18');
    $('metin').textContent = h.message;
    puntoAyarla($('metin'), h.message.length, 44, 28, 60, 220);

    if (yeni) {
      // Giriş animasyonunu yeniden tetikle. requestAnimationFrame KULLANMA:
      // OBS kaynağı gizliyken kare üretilmediği için geri çağrı hiç çalışmıyor ve
      // mesaj görünmez kalıyor. Senkron reflow her durumda işini görür.
      $('mesaj').classList.remove('acik');
      void $('mesaj').offsetWidth;
    }
    $('mesaj').classList.add('acik');
  }

  function raporCiz(r) {
    const ses = $('ses');
    if (!r) {
      $('rapor').classList.remove('acik');
      $('eq').classList.remove('acik');
      clearInterval(yazmaTimer);
      ses.pause();
      sonNonce = 0;
      return;
    }

    const renk = skorRengi(r.skor);
    document.documentElement.style.setProperty('--skorRenk', renk);

    $('teshis').textContent = r.teshis;
    puntoAyarla($('teshis'), r.teshis.length, 54, 34, 22, 60);
    $('skorDeger').textContent = '%' + r.skor;
    $('rapor').classList.add('acik');

    // Bar sıfırdan dolsun: reflow ile transition'ı tetikle (rAF gizli kaynakta çalışmaz).
    $('skorDolu').style.width = '0%';
    void $('skorDolu').offsetWidth;
    $('skorDolu').style.width = r.skor + '%';

    if (r.nonce === sonNonce) {
      // Aynı rapor tekrar geldi (ör. avatar güncellemesi): metni olduğu gibi bırak.
      if (!yazmaTimer) $('raporMetin').textContent = r.rapor;
      return;
    }
    sonNonce = r.nonce;
    puntoAyarla($('raporMetin'), r.rapor.length, 33, 24, 140, 470);

    // OBS kaynağı yenilenince eski bir rapor yeniden seslendirilmesin diye
    // sadece yeni üretilmiş raporların sesi çalınır.
    const taze = Date.now() - new Date(r.at).getTime() < 60000;

    if (r.audioUrl && taze && sesBendeMi) {
      ses.src = r.audioUrl;
      ses.currentTime = 0;
      // Sesli modda yazı, ses başlayınca konuşma süresine yayılarak yazılır.
      pendingRapor = r.rapor;
      ses.play().catch((e) => {
        console.warn('Ses çalınamadı (OBS dışında autoplay engelli olabilir):', e);
        if (pendingRapor) { daktilo($('raporMetin'), pendingRapor, 2200); pendingRapor = null; }
      });
    } else {
      ses.pause();
      $('eq').classList.remove('acik');
      daktilo($('raporMetin'), r.rapor, taze ? 2200 : 1);
    }
  }

  let pendingRapor = null;

  const ses = $('ses');
  ses.addEventListener('playing', () => {
    $('eq').classList.add('acik');
    if (pendingRapor) {
      const sure = (isFinite(ses.duration) && ses.duration > 0 ? ses.duration * 1000 : 4000) * 0.82;
      daktilo($('raporMetin'), pendingRapor, sure);
      pendingRapor = null;
    }
  });
  ses.addEventListener('ended', () => $('eq').classList.remove('acik'));
  ses.addEventListener('error', () => {
    $('eq').classList.remove('acik');
    if (pendingRapor) { daktilo($('raporMetin'), pendingRapor, 2200); pendingRapor = null; }
  });

  socket.on('ayarlar', (a) => {
    $('sahne').classList.toggle('zeminli', Boolean(a && a.zemin));
  });

  socket.on('overlay:state', (s) => {
    mesajCiz(s.highlight);
    raporCiz(s.rapor);
  });
</script>
</body>
</html>
