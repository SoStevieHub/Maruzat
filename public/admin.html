<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mental0 · Panel</title>
<style>
  * { box-sizing: border-box; }
  /* Koyu tema varsayılan değil: Serkan aydınlığı tercih ediyor, seçim
     localStorage'da saklanıyor. Renkler tek yerden, değişkenlerle yönetiliyor. */
  :root, :root[data-tema="acik"] {
    color-scheme: light;
    --bg: #f3f5f8;
    --kart: #ffffff;
    --kart2: #eceff4;
    --cizgi: #d7dde5;
    --yazi: #1a1f26;
    --soluk: #667085;
    --vurgu: #2f9e0a;
    --vurgu-yazi: #ffffff;
    --vurgu-hover: #38b80d;
    --mavi: #1a73e8;
    --mavi-yazi: #ffffff;
    --mavi-hover: #1765cc;
    --uyari: #b3801a;
    --kirmizi: #c5221f;
    --btn-hover: #e2e7ee;
    --btn-hover-cizgi: #b9c2ce;
    --secili-bg: #e6f4e0;
    --secili-cizgi: #9ccf87;
    --riskli-bg: #fdeaea;
    --riskli-cizgi: #f0b4b4;
    --sil-cizgi: #f0b4b4;
    --sil-yazi: #b3261e;
    --rozet-bg: #e6f4e0;
    --rozet-cizgi: #9ccf87;
  }

  :root[data-tema="koyu"] {
    color-scheme: dark;
    --bg: #0d0f12;
    --kart: #15181d;
    --kart2: #1c2027;
    --cizgi: #262b33;
    --yazi: #e8ebef;
    --soluk: #8b939f;
    --vurgu: #53fc18;
    --vurgu-yazi: #06210a;
    --vurgu-hover: #6cff3a;
    --mavi: #4aa8ff;
    --mavi-yazi: #04203d;
    --mavi-hover: #6fbcff;
    --uyari: #ffc531;
    --kirmizi: #ff5252;
    --btn-hover: #262c35;
    --btn-hover-cizgi: #3a424e;
    --secili-bg: #1f2a1a;
    --secili-cizgi: #33501f;
    --riskli-bg: #2a1a1a;
    --riskli-cizgi: #4a2a2a;
    --sil-cizgi: #4a2a2a;
    --sil-yazi: #ff9a9a;
    --rozet-bg: #1f2a1a;
    --rozet-cizgi: #33501f;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--yazi);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  header {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 12px 20px;
    background: var(--kart);
    border-bottom: 1px solid var(--cizgi);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  .rozet {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--soluk);
  }
  .nokta { width: 9px; height: 9px; border-radius: 50%; background: var(--kirmizi); }
  .nokta.on { background: var(--vurgu); box-shadow: 0 0 8px var(--vurgu); }
  header .sag { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  select, input[type=text], input[type=number], textarea {
    background: var(--kart2); color: var(--yazi);
    border: 1px solid var(--cizgi); border-radius: 6px;
    padding: 7px 9px; font: inherit;
  }
  textarea { width: 100%; resize: vertical; line-height: 1.45; }

  button {
    background: var(--kart2); color: var(--yazi);
    border: 1px solid var(--cizgi); border-radius: 6px;
    padding: 7px 12px; font: inherit; cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  button:hover:not(:disabled) { background: var(--btn-hover); border-color: var(--btn-hover-cizgi); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ana { background: var(--vurgu); border-color: var(--vurgu); color: var(--vurgu-yazi); font-weight: 600; }
  button.ana:hover:not(:disabled) { background: var(--vurgu-hover); border-color: var(--vurgu-hover); }
  button.mavi { background: var(--mavi); border-color: var(--mavi); color: var(--mavi-yazi); font-weight: 600; }
  button.mavi:hover:not(:disabled) { background: var(--mavi-hover); border-color: var(--mavi-hover); }
  button.sil { border-color: var(--sil-cizgi); color: var(--sil-yazi); }

  main { display: grid; grid-template-columns: 1fr 460px; gap: 16px; padding: 16px; align-items: start; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }

  .panel { background: var(--kart); border: 1px solid var(--cizgi); border-radius: 10px; }
  .panel > h2 {
    margin: 0; padding: 12px 16px;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--soluk);
    border-bottom: 1px solid var(--cizgi);
    display: flex; align-items: center; gap: 10px;
  }
  .panel > h2 .sag { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 12px; text-transform: none; letter-spacing: 0; }
  .icerik { padding: 14px 16px; }

  /* ─── Sekmeler ─── */
  .sekmeler { display: flex; gap: 4px; }
  .sekme {
    background: transparent; border: 1px solid transparent; border-radius: 6px;
    padding: 5px 11px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--soluk);
  }
  .sekme:hover:not(.aktif) { background: var(--kart2); color: var(--yazi); }
  .sekme.aktif { background: var(--kart2); border-color: var(--cizgi); color: var(--yazi); }
  .sayac {
    display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px;
    border-radius: 9px; background: var(--cizgi); color: var(--yazi);
    font-size: 11px; letter-spacing: 0; text-align: center;
  }
  .sekme.aktif .sayac { background: var(--vurgu); color: var(--vurgu-yazi); font-weight: 700; }

  /* ─── Kayıt çubuğu ─── */
  .log-cubugu {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; border-top: 1px solid var(--cizgi);
    font-size: 12px; color: var(--soluk);
  }
  .log-cubugu a { color: var(--mavi); text-decoration: none; }
  .log-cubugu a:hover { text-decoration: underline; }
  .log-cubugu button { padding: 5px 10px; font-size: 12px; }

  /* ─── Chat listesi ─── */
  #chat, #linkListe { max-height: calc(100vh - 250px); overflow-y: auto; padding: 8px; }

  /* Chat metnindeki bağlantılar — güvenilmeyen kaynaktan geldiği için sunucuda
     ayrıştırılıp yalnızca http/https olanlar buraya bağlantı olarak basılıyor. */
  .msg a, .link-adres { color: var(--mavi); text-decoration: none; word-break: break-all; }
  .msg a:hover, .link-adres:hover { text-decoration: underline; }

  .link-satir {
    display: flex; gap: 11px; align-items: center;
    padding: 9px 10px; border-radius: 8px;
  }
  .link-satir:hover { background: var(--kart2); }
  .link-satir .txt { flex: 1; min-width: 0; }
  .link-adres { display: block; font-size: 14px; }
  .link-kim { font-size: 12px; color: var(--soluk); }
  .satir {
    display: flex; gap: 11px; align-items: flex-start;
    padding: 9px 10px; border-radius: 8px;
  }
  .satir:hover { background: var(--kart2); }
  .satir.secili { background: var(--secili-bg); outline: 1px solid var(--secili-cizgi); }
  .satir.riskli { background: var(--riskli-bg); outline: 1px solid var(--riskli-cizgi); }
  .av { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .av .h {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #0a0a0a;
  }
  .satir .txt { flex: 1; min-width: 0; }
  .satir .ad { font-weight: 600; font-size: 13px; }
  .satir .msg { word-wrap: break-word; overflow-wrap: anywhere; }
  .satir .zaman { font-size: 11px; color: var(--soluk); }
  .satir .btn { display: flex; gap: 6px; flex-shrink: 0; }
  .satir .btn button { padding: 5px 9px; font-size: 12px; }
  .risk-etiket {
    display: inline-block; font-size: 11px; color: var(--kirmizi);
    border: 1px solid var(--riskli-cizgi); border-radius: 4px; padding: 1px 6px; margin-left: 6px;
  }

  /* ─── Rapor editörü ─── */
  .alan { margin-bottom: 12px; }
  .alan label { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--soluk); margin-bottom: 5px; }
  .alan input[type=text] { width: 100%; }
  .satir-2 { display: flex; gap: 10px; }
  .butonlar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .bos { color: var(--soluk); font-size: 13px; padding: 8px 0; }
  .kaynak { font-size: 11px; color: var(--soluk); margin-top: 8px; }
  .hata { color: var(--kirmizi); font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
  .yayin-rozet {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px;
    background: var(--rozet-bg); color: var(--vurgu); border: 1px solid var(--rozet-cizgi);
  }
  .onizle-mesaj {
    background: var(--kart2); border: 1px solid var(--cizgi); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 14px;
  }
  .onizle-mesaj .ad { font-weight: 600; }
</style>
</head>
<script>
  // İlk boyamadan ÖNCE çalışsın: yoksa açılışta bir kare yanlış temada yanıp sönüyor.
  document.documentElement.dataset.tema = localStorage.getItem('mental0-tema') || 'acik';
</script>
<body>

<header>
  <h1>🧠 MENTAL0</h1>
  <span class="rozet"><span class="nokta" id="pusherNokta"></span><span id="pusherYazi">bağlanıyor…</span></span>
  <span class="rozet" id="kanalYazi"></span>

  <div class="sag">
    <label class="rozet">Üslup
      <select id="uslupSec"></select>
    </label>
    <label class="rozet">Ses
      <select id="sesSec"></select>
    </label>
    <label class="rozet">Hız
      <select id="hizSec">
        <option value="-15%">yavaş</option>
        <option value="0%" selected>normal</option>
        <option value="+15%">hızlı</option>
        <option value="+30%">çok hızlı</option>
      </select>
    </label>
    <label class="rozet" title="Overlay'de yazının arkasına yukarı doğru açılan gradient">

    <button id="temaDugmesi" title="Açık / koyu tema">🌙</button>

<main>
  <section class="panel">
    <h2>
      <span class="sekmeler">
        <button class="sekme aktif" data-sekme="sohbet">Sohbet</button>
        <button class="sekme" data-sekme="linkler">Linkler <span class="sayac" id="linkSayac">0</span></button>
      </span>
      <span class="sag">

  <section class="panel">

      <div id="secilenKutu"><div class="bos">Henüz bir mesaj seçilmedi. Soldan “Öne Çıkar” veya “AI Analiz” ile başla.</div></div>

      <div id="raporKutu" style="display:none">
        <div class="alan">

            <label>Skor</label>

          </div>
          <div class="alan" style="flex:1">
            <label>Üslup</label>
            <input type="text" id="uslupGoster" readonly style="width:100%">

        </div>
        <div class="alan">
          <label>Rapor metni</label>
          <textarea id="raporMetin" rows="4"></textarea>
        </div>

        <div class="butonlar">
          <button id="yenidenUret">🔄 Yeniden üret</button>
          <button id="sesOnizle">🎧 Sesi dinle</button>
          <button class="mavi" id="yayinlaYazili">Yayına ver (yazılı)</button>
          <button class="ana" id="yayinlaSesli">Yayına ver (sesli)</button>

      <div class="hata" id="hata"></div>

      <hr style="border:0;border-top:1px solid var(--cizgi);margin:16px 0">
      <div class="butonlar">
        <button id="tekrarCal">🔁 Sesi tekrar çal</button>
        <button class="sil" id="raporKaldir">Raporu kaldır</button>
        <button class="sil" id="overlayTemizle">Overlay'i tamamen temizle</button>

<audio id="onizleSes"></audio>

<script src="/socket.io/socket.io.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const socket = io();

  let mesajlar = [];
  let linkler = [];
  let aktifSekme = 'sohbet';
  let secili = null;      // { id, user, message, ... }
  let taslak = null;      // { teshis, skor, rapor, uslup, saglayici }
  let overlayDurumu = { highlight: null, rapor: null };
  let config = null;

  // ─── Yardımcılar ───────────────────────────────────────────────────────────
  async function api(yol, govde) {
    const res = await fetch(yol, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(govde || {}),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.detay || json.error || `HTTP ${res.status}`);
    return json;
  }

  function hataGoster(e) {
    $('hata').textContent = e ? String(e.message || e) : '';
  }

  function harf(isim) {
    return (isim || '?').trim().charAt(0).toLocaleUpperCase('tr-TR');
  }

  function avatarHtml(m, boyut) {
    if (m.avatar) return `<div class="av" style="width:${boyut}px;height:${boyut}px"><img src="${m.avatar}" alt=""></div>`;
    return `<div class="av" style="width:${boyut}px;height:${boyut}px"><div class="h" style="background:${m.color || '#53fc18'}">${harf(m.user)}</div></div>`;
  }

  function saat(iso) {
    return new Date(iso).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function kacir(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  // Metni tıklanabilir yapar. Hangi parçanın bağlantı olduğuna SUNUCU karar veriyor
  // (m.links = [{raw, url}]); burada sadece o parçalar <a>'ya çevriliyor, gerisi kaçırılıyor.
  // Böylece chat'ten gelen "javascript:" gibi şemalar hiçbir şekilde bağlantıya dönüşemiyor.
  function mesajMetni(m) {
    const links = Array.isArray(m.links) ? m.links : [];
    if (!links.length) return kacir(m.message);

    let html = '';
    let kalan = m.message;
    for (const { raw, url } of links) {
      const i = kalan.indexOf(raw);
      if (i === -1) continue;
      html += kacir(kalan.slice(0, i));
      html += `<a href="${kacir(url)}" target="_blank" rel="noopener noreferrer">${kacir(raw)}</a>`;
      kalan = kalan.slice(i + raw.length);
    }
    return html + kacir(kalan);
  }

  // Kick'in sohbet renkleri koyu zemin için seçilmiş; beyaz panelde parlak sarı/yeşil
  // okunmuyor. Rengi olduğu gibi kullanmak yerine temaya göre koyulaştırıp
  // açıyoruz. Avatar dairesinin ZEMİNİ için özgün renk korunuyor (üstünde koyu harf var),
  // bu sadece YAZI rengi için.
  function yaziRengi(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
    if (!m) return 'inherit';
    let [r, g, b] = [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16));

    // Gerçek WCAG bağıl parlaklığı: naif ortalama kullanınca renkler aşırı
    // koyulaşıp birbirinden ayırt edilemez hale geliyordu.
    const kanalL = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    const L = () => 0.2126 * kanalL(r) + 0.7152 * kanalL(g) + 0.0722 * kanalL(b);

    const koyuTema = document.documentElement.dataset.tema === 'koyu';
    const zeminL = koyuTema ? 0.009 : 1;   // panel zemini: #15181d / #ffffff
    const oran = () => {
      const a = L();
      return (Math.max(a, zeminL) + 0.05) / (Math.min(a, zeminL) + 0.05);
    };

    // Okunur olana kadar sadece gerektiği kadar koyulaştır/aç — renk kimliği korunsun.
    for (let i = 0; i < 60 && oran() < 4.5; i++) {
      if (koyuTema) {
        r = Math.min(255, r * 1.12 + 8);
        g = Math.min(255, g * 1.12 + 8);
        b = Math.min(255, b * 1.12 + 8);
      } else {
        r *= 0.88; g *= 0.88; b *= 0.88;
      }
    }
    const kanal = (v) => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2, '0');
    return '#' + kanal(r) + kanal(g) + kanal(b);
  }

  function kisaUrl(url, uzunluk = 70) {
    const s = String(url).replace(/^https?:\/\//i, '').replace(/\/$/, '');
    return s.length > uzunluk ? s.slice(0, uzunluk - 1) + '…' : s;
  }

  // ─── Sekmeler ──────────────────────────────────────────────────────────────
  function sekmeSec(ad) {
    aktifSekme = ad;
    document.querySelectorAll('.sekme').forEach((b) => b.classList.toggle('aktif', b.dataset.sekme === ad));
    $('chat').style.display = ad === 'sohbet' ? '' : 'none';
    $('linkListe').style.display = ad === 'linkler' ? '' : 'none';
    if (ad === 'linkler') linklerCiz();
  }

  document.querySelectorAll('.sekme').forEach((b) => {
    b.onclick = () => sekmeSec(b.dataset.sekme);
  });

  function linklerCiz() {
    $('linkSayac').textContent = linkler.length;
    if (aktifSekme !== 'linkler') return;

    const kutu = $('linkListe');
    if (!linkler.length) {
      kutu.innerHTML = '<div class="bos" style="padding:16px">Henüz link gelmedi.</div>';
      return;
    }

    // En yeni üstte — link listesinde geçmişe kaydırmak yerine son geleni görmek istiyoruz.
    kutu.innerHTML = [...linkler].reverse().map((l) => {
      const mesajDuruyor = mesajlar.some((m) => m.id === l.messageId);
      return `
      <div class="link-satir">
        ${avatarHtml(l, 30)}
        <div class="txt">
          <a class="link-adres" href="${kacir(l.url)}" target="_blank" rel="noopener noreferrer">${kacir(kisaUrl(l.url))}</a>
          <span class="link-kim" style="color:${yaziRengi(l.color)}">${kacir(l.user)}</span>
          <span class="link-kim"> · ${saat(l.at)}</span>
        </div>
        <div class="btn">
          <button data-act="highlight" data-id="${l.messageId}" ${mesajDuruyor ? '' : 'disabled'}>Öne Çıkar</button>
          <button data-act="analiz" data-id="${l.messageId}" ${mesajDuruyor ? '' : 'disabled'}>AI Analiz</button>
        </div>
      </div>`;
    }).join('');
  }

  // ─── Chat listesi ──────────────────────────────────────────────────────────
  function chatCiz() {
    const kutu = $('chat');
    const altta = kutu.scrollHeight - kutu.scrollTop - kutu.clientHeight < 60;

    if (!mesajlar.length) {
      kutu.innerHTML = '<div class="bos" style="padding:16px">Mesaj bekleniyor…</div>';
      return;
    }

    kutu.innerHTML = mesajlar.map((m) => `
      <div class="satir ${overlayDurumu.highlight?.id === m.id ? 'secili' : ''} ${m.risk ? 'riskli' : ''}" data-id="${m.id}">
        ${avatarHtml(m, 34)}
        <div class="txt">
          <div class="ad" style="color:${yaziRengi(m.color)}">${kacir(m.user)}
            <span class="zaman">${saat(m.at)}</span>
            ${m.risk ? '<span class="risk-etiket">riskli — AI kapalı</span>' : ''}
          </div>
          <div class="msg">${mesajMetni(m)}</div>
        </div>
        <div class="btn">
          <button data-act="highlight" data-id="${m.id}">Öne Çıkar</button>
          <button data-act="analiz" data-id="${m.id}" ${m.risk ? 'disabled' : ''}>AI Analiz</button>
        </div>
      </div>
    `).join('');

    if (altta && $('otoKaydir').checked) kutu.scrollTop = kutu.scrollHeight;
  }

  // Aynı butonlar hem Sohbet hem Linkler sekmesinde olduğu için tek yerden yönetiliyor.
  async function satirTiklama(e) {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const id = Number(btn.dataset.id);
    hataGoster(null);

    try {
      if (btn.dataset.act === 'highlight') {
        await api('/api/highlight', { messageId: id });
        secili = mesajlar.find((m) => m.id === id) || null;
        taslak = null;
        seciliCiz();
      } else {
        secili = mesajlar.find((m) => m.id === id) || null;
        await api('/api/highlight', { messageId: id });   // analizde de mesaj overlay'e düşer
        seciliCiz();
        await analizEt(id);
      }
    } catch (err) { hataGoster(err); }
  }

  $('chat').addEventListener('click', satirTiklama);
  $('linkListe').addEventListener('click', satirTiklama);

  // ─── Seçilen mesaj + rapor taslağı ─────────────────────────────────────────
  function seciliCiz() {
    if (!secili) {
      $('secilenKutu').innerHTML = '<div class="bos">Henüz bir mesaj seçilmedi.</div>';
      $('raporKutu').style.display = 'none';
      return;
    }
    $('secilenKutu').innerHTML = `
      <div class="onizle-mesaj">
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">
          ${avatarHtml(secili, 30)}
          <span class="ad" style="color:${yaziRengi(secili.color)}">${kacir(secili.user)}</span>
          <span class="yayin-rozet" style="margin-left:auto">overlay'de</span>
        </div>
        <div>${kacir(secili.message)}</div>
      </div>`;
    $('raporKutu').style.display = taslak ? 'block' : 'none';
  }

  async function analizEt(messageId) {
    const btnlar = document.querySelectorAll('button[data-act="analiz"], #yenidenUret');
    btnlar.forEach((b) => (b.disabled = true));
    $('raporKutu').style.display = 'block';
    $('kaynak').textContent = 'AI düşünüyor…';
    try {
      const r = await api('/api/analiz', { messageId, uslup: $('uslupSec').value });
      taslak = r;
      $('teshis').value = r.teshis;
      $('skor').value = r.skor;
      $('raporMetin').value = r.rapor;
      $('uslupGoster').value = (config.usluplar.find((u) => u.id === r.uslup) || {}).etiket || r.uslup;
      $('kaynak').textContent = 'Model: ' + r.saglayici + (r.denemeler?.length ? ` · ${r.denemeler.length} sağlayıcı atlandı` : '');
      hataGoster(null);
    } catch (err) {
      taslak = null;
      $('raporKutu').style.display = 'none';
      $('kaynak').textContent = '';
      hataGoster(err);
    } finally {
      btnlar.forEach((b) => (b.disabled = false));
      chatCiz();
    }
  }

  $('yenidenUret').onclick = () => secili && analizEt(secili.id);

  function taslakOku() {
    return {
      teshis: $('teshis').value,
      skor: Number($('skor').value),
      rapor: $('raporMetin').value,
      uslup: taslak?.uslup,
    };
  }

  async function yayinla(sesli) {
    const btn = sesli ? $('yayinlaSesli') : $('yayinlaYazili');
    const eski = btn.textContent;
    btn.disabled = true;
    btn.textContent = sesli ? 'Seslendiriliyor…' : 'Gönderiliyor…';
    try {
      await api('/api/rapor/yayinla', { ...taslakOku(), sesli });
      hataGoster(null);
    } catch (err) { hataGoster(err); }
    finally { btn.disabled = false; btn.textContent = eski; }
  }

  $('yayinlaYazili').onclick = () => yayinla(false);
  $('yayinlaSesli').onclick = () => yayinla(true);

  $('sesOnizle').onclick = async () => {
    const btn = $('sesOnizle');
    btn.disabled = true;
    try {
      const t = taslakOku();
      const r = await api('/api/tts/onizle', { text: `${t.teshis}. ${t.rapor}` });
      $('onizleSes').src = r.url;
      $('onizleSes').play();
      hataGoster(null);
    } catch (err) { hataGoster(err); }
    finally { btn.disabled = false; }
  };

  $('sesTest').onclick = async () => {
    try {
      const r = await api('/api/tts/onizle', { text: 'Hastanın dosyası incelenmiştir. Durum ciddi.', ses: $('sesSec').value });
      $('onizleSes').src = r.url;
      $('onizleSes').play();
      hataGoster(null);
    } catch (err) { hataGoster(err); }
  };

  $('tekrarCal').onclick = () => api('/api/rapor/tekrar-cal').catch(hataGoster);
  $('raporKaldir').onclick = () => api('/api/rapor/temizle').catch(hataGoster);
  $('overlayTemizle').onclick = async () => {
    try { await api('/api/highlight/temizle'); secili = null; taslak = null; seciliCiz(); }
    catch (err) { hataGoster(err); }
  };

  // ─── Ayarlar ───────────────────────────────────────────────────────────────
  function ayarGonder() {
    api('/api/ayarlar', {
      uslup: $('uslupSec').value,
      ses: $('sesSec').value,
      konusmaHizi: $('hizSec').value,
      zemin: $('zeminSec').checked,
    }).catch(hataGoster);
  }
  $('zeminSec').onchange = ayarGonder;
  $('uslupSec').onchange = ayarGonder;
  $('sesSec').onchange = ayarGonder;
  $('hizSec').onchange = ayarGonder;

  // ─── Test mesajı ───────────────────────────────────────────────────────────
  $('testGonder').onclick = () => {
    const t = $('testMesaj').value.trim();
    if (!t) return;
    api('/api/test/mesaj', { message: t, user: 'testkullanici' });
    $('testMesaj').value = '';
  };
  $('testMesaj').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('testGonder').click(); });

  // ─── Tema ──────────────────────────────────────────────────────────────────
  function temaUygula(tema) {
    document.documentElement.dataset.tema = tema;
    localStorage.setItem('mental0-tema', tema);
    $('temaDugmesi').textContent = tema === 'acik' ? '🌙' : '☀️';
    // Kullanıcı renkleri temaya göre hesaplandığı için listeler yeniden çizilmeli.
    if (typeof mesajlar !== 'undefined') { chatCiz(); linklerCiz(); seciliCiz(); }
  }
  temaUygula(localStorage.getItem('mental0-tema') || 'acik');
  $('temaDugmesi').onclick = () => {
    temaUygula(document.documentElement.dataset.tema === 'acik' ? 'koyu' : 'acik');
  };

  // ─── Kayıt (log) ───────────────────────────────────────────────────────────
  function logBilgiCiz(b) {
    if (!b) return;
    const kb = b.bayt < 1024 ? `${b.bayt} B` : `${(b.bayt / 1024).toFixed(1)} KB`;
    $('logBilgi').textContent = b.satir ? `kayıt: ${b.satir} mesaj · ${kb}` : 'kayıt: boş';
    $('logIndir').style.display = b.satir ? '' : 'none';
  }

  $('logTemizle').onclick = async () => {
    if (!confirm('Chat kaydı silinecek: log dosyası, sohbet listesi ve linkler.\nBu geri alınamaz. Devam?')) return;
    try {
      const r = await api('/api/log/temizle');
      logBilgiCiz(r.log);
      hataGoster(null);
    } catch (err) { hataGoster(err); }
  };

  // ─── Socket ────────────────────────────────────────────────────────────────
  socket.on('chat:bulk', (liste) => { mesajlar = liste; chatCiz(); linklerCiz(); });
  socket.on('chat:message', (m) => {
    mesajlar.push(m);
    if (mesajlar.length > 200) mesajlar = mesajlar.slice(-200);
    chatCiz();
  });
  socket.on('chat:avatar', ({ userId, avatar }) => {
    let degisti = false;
    for (const m of mesajlar) if (m.userId === userId && !m.avatar) { m.avatar = avatar; degisti = true; }
    for (const l of linkler) if (l.userId === userId && !l.avatar) l.avatar = avatar;
    if (secili && secili.userId === userId && !secili.avatar) { secili.avatar = avatar; seciliCiz(); }
    if (degisti) { chatCiz(); linklerCiz(); }
  });
  socket.on('link:bulk', (liste) => { linkler = liste; linklerCiz(); });
  socket.on('link:yeni', (yeni) => {
    linkler.push(...yeni);
    if (linkler.length > 300) linkler = linkler.slice(-300);
    linklerCiz();
  });
  socket.on('log:bilgi', logBilgiCiz);
  socket.on('overlay:state', (s) => {
    overlayDurumu = s;
    $('yayinDurum').innerHTML = s.rapor
      ? `<span class="yayin-rozet">rapor yayında${s.rapor.audioUrl ? ' · sesli' : ''}</span>`
      : (s.highlight ? '<span class="yayin-rozet">mesaj yayında</span>' : '');
    chatCiz();
  });
  socket.on('pusher:status', (s) => {
    $('pusherNokta').classList.toggle('on', s.connected);
    $('pusherYazi').textContent = s.connected ? 'Kick chat bağlı' : 'chat bağlantısı yok';
  });
  socket.on('ayarlar', (a) => {
    $('zeminSec').checked = Boolean(a.zemin);
    $('uslupSec').value = a.uslup;
    $('sesSec').value = a.ses;
    $('hizSec').value = a.konusmaHizi;
  });

  // ─── Açılış ────────────────────────────────────────────────────────────────
  (async () => {
    config = await fetch('/api/config').then((r) => r.json());
    $('uslupSec').innerHTML = config.usluplar.map((u) => `<option value="${u.id}">${u.etiket}</option>`).join('');
    $('sesSec').innerHTML = config.sesler.map((s) => `<option value="${s.id}">${s.etiket}</option>`).join('');
    $('uslupSec').value = config.ayarlar.uslup;
    $('sesSec').value = config.ayarlar.ses;
    $('hizSec').value = config.ayarlar.konusmaHizi;
    $('zeminSec').checked = Boolean(config.ayarlar.zemin);
    $('kanalYazi').textContent = `kanal: ${config.kanal} · LLM: ${config.saglayicilar.length ? config.saglayicilar.join(' → ') : 'YOK (.env boş)'}`;
    if (!config.avatarAktif) {
      $('kanalYazi').textContent += ' · avatar: kapalı';
    }
  })();
</script>
</body>
</html>
